<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .primary-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 100%); }
        .card-bg { background: #ffffff; }
        .hover-lift { transition: box-shadow 0.2s ease; }
        .hover-lift:hover { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="primary-bg text-white py-8 px-4 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-4xl font-bold mb-1">Student Management System</h1>
            <p class="text-blue-100">Streamline student record management</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="card-bg p-6 rounded-lg shadow-md hover-lift border-l-4 border-blue-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Total Students</h3>
                <p class="text-3xl font-bold text-gray-800" id="total-students">0</p>
            </div>
            <div class="card-bg p-6 rounded-lg shadow-md hover-lift border-l-4 border-green-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Average CGPA</h3>
                <p class="text-3xl font-bold text-gray-800" id="avg-gpa">0.00</p>
            </div>
            <div class="card-bg p-6 rounded-lg shadow-md hover-lift border-l-4 border-purple-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Active Courses</h3>
                <p class="text-3xl font-bold text-gray-800" id="total-courses">0</p>
            </div>
            <div class="card-bg p-6 rounded-lg shadow-md hover-lift border-l-4 border-orange-500">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-1">Academic Years</h3>
                <p class="text-3xl font-bold text-gray-800" id="total-years">0</p>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="card-bg rounded-lg shadow-xl p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 pb-3 border-b border-gray-200">Add New Student</h2>
                    <form id="student-form" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                            <input type="text" id="name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Course</label>
                            <select id="course" required class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition bg-white">
                                <option value="">Select a course</option>
                                <option value="BCA">BCA</option>
                                <option value="BBA">BBA</option>
                                <option value="B.Tech (IT)">B.Tech (IT)</option>
                                <option value="B.Tech (CS)">B.Tech (CS)</option>
                                <option value="B.Tech (Electrical)">B.Tech (Electrical)</option>
                                <option value="B.Tech (Mechanical)">B.Tech (Mechanical)</option>
                                <option value="B.Pharm">B.Pharm</option>
                                <option value="M.Pharm">M.Pharm</option>
                                <option value="MCA">MCA</option>
                                <option value="MBA">MBA</option>
                                <option value="B.sc">B.sc</option>
                                <option value="M.sc">M.sc</option>
                                <option value="M.Tech">M.Tech</option>
                                <option value="BPT">BPT</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                            <input type="number" id="year" min="1" max="10" required class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CGPA (0.0 - 10.0)</label>
                            <input type="number" id="gpa" step="0.01" min="0" max="10" required class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                        </div>
                        <input type="hidden" id="edit-id">
                        <button type="submit" class="w-full primary-bg text-white font-semibold py-2.5 rounded-md hover:opacity-90 transition">
                            <span id="submit-text">Add Student</span>
                        </button>
                    </form>
                </div>

                <div class="card-bg rounded-lg shadow-xl p-6 mt-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 pb-3 border-b border-gray-200">Search & Filter</h2>
                    <input type="text" id="search-input" placeholder="Search by name, email, or course..." class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition mb-4">
                    
                    <div class="space-y-3">
                        <button onclick="exportToCSV()" class="w-full bg-green-600 text-white font-semibold py-2 rounded-md hover:bg-green-700 transition flex items-center justify-center gap-2">
                            <span>Export to CSV</span>
                        </button>
                        
                        <div class="border-t border-gray-100 pt-3">
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Bulk Import (CSV)</label>
                            <input type="file" id="csv-file" accept=".csv" class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <button onclick="importCSV()" class="w-full mt-2 bg-blue-100 text-blue-700 font-semibold py-2 rounded-md hover:bg-blue-200 transition text-sm">
                                Import Records
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                <div class="card-bg rounded-lg shadow-xl p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 pb-3 border-b border-gray-200">Top Performers</h2>
                    <div id="top-performers" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Top performers will be rendered here -->
                    </div>
                </div>

                <div class="card-bg rounded-lg shadow-xl p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-6 pb-3 border-b border-gray-200">Student List</h2>
                    <div id="student-list" class="space-y-4">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let students = [];
        let editingId = null;

        async function fetchStudents() {
            const response = await fetch('/api/students');
            students = await response.json();
            renderStudents();
            fetchStatistics();
        }

        async function fetchStatistics() {
            const response = await fetch('/api/statistics');
            const stats = await response.json();
            document.getElementById('total-students').textContent = stats.total;
            document.getElementById('avg-gpa').textContent = stats.avg_gpa;
            document.getElementById('total-courses').textContent = Object.keys(stats.courses).length;
            document.getElementById('total-years').textContent = Object.keys(stats.years).length;
            renderTopPerformers(stats.top_performers);
        }

        function renderTopPerformers(performers) {
            const container = document.getElementById('top-performers');
            if (!performers || performers.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 italic">No performers identified yet</p>';
                return;
            }
            container.innerHTML = performers.map(s => `
                <div class="flex items-center gap-3 p-3 bg-blue-50 rounded-lg border border-blue-100">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">
                        ${s.name.charAt(0)}
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-800">${s.name}</p>
                        <p class="text-xs text-blue-600 font-bold">${s.course} • CGPA: ${s.gpa}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderStudents(filter = '') {
            const container = document.getElementById('student-list');
            const filteredStudents = students.filter(s => 
                s.name.toLowerCase().includes(filter.toLowerCase()) ||
                s.email.toLowerCase().includes(filter.toLowerCase()) ||
                s.course.toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filteredStudents.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-gray-500"><p class="text-lg">No students found</p></div>';
                return;
            }
            
            container.innerHTML = filteredStudents.map(student => `
                <div class="card-bg p-5 rounded-md shadow-sm hover-lift border border-gray-200">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="text-lg font-semibold text-gray-800">${student.name}</h3>
                                <span class="px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded text-[10px] font-bold uppercase tracking-wider">Grade: ${student.grade || 'N/A'}</span>
                            </div>
                            <p class="text-gray-600 text-sm mt-1">${student.email}</p>
                            <div class="mt-3 flex flex-wrap gap-2">
                                <span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded text-xs font-medium">${student.course}</span>
                                <span class="px-2.5 py-1 bg-gray-100 text-gray-700 rounded text-xs font-medium">Year ${student.year}</span>
                                <span class="px-2.5 py-1 bg-green-50 text-green-700 rounded text-xs font-medium">CGPA: ${student.gpa}</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-3">Enrolled: ${new Date(student.enrollment_date).toLocaleDateString()}</p>
                        </div>
                        <div class="flex gap-2 ml-4">
                            <button onclick="editStudent(${student.id})" class="px-3 py-1.5 bg-yellow-500 text-white text-sm rounded hover:bg-yellow-600 transition">Edit</button>
                            <button onclick="deleteStudent(${student.id})" class="px-3 py-1.5 bg-red-500 text-white text-sm rounded hover:bg-red-600 transition">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function exportToCSV() {
            const searchValue = document.getElementById('search-input').value;
            let exportUrl = '/api/export/csv';
            if (searchValue) {
                exportUrl += `?search=${encodeURIComponent(searchValue)}`;
            }
            window.location.href = exportUrl;
        }

        async function importCSV() {
            const fileInput = document.getElementById('csv-file');
            if (fileInput.files.length === 0) {
                alert('Please select a CSV file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/import/csv', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Import failed');

                const result = await response.json();
                alert(result.message);
                fileInput.value = '';
                await fetchStudents();
            } catch (error) {
                alert('Error importing file: ' + error.message);
            }
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                course: document.getElementById('course').value,
                year: parseInt(document.getElementById('year').value),
                gpa: parseFloat(document.getElementById('gpa').value)
            };

            try {
                let response;
                if (editingId) {
                    response = await fetch(`/api/students/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(student)
                    });
                } else {
                    response = await fetch('/api/students', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(student)
                    });
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to save student record');
                }

                editingId = null;
                document.getElementById('submit-text').textContent = 'Add Student';
                document.getElementById('student-form').reset();
                await fetchStudents();
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            }
        });

        async function editStudent(id) {
            const student = students.find(s => s.id === id);
            document.getElementById('name').value = student.name;
            document.getElementById('email').value = student.email;
            document.getElementById('course').value = student.course;
            document.getElementById('year').value = student.year;
            document.getElementById('gpa').value = student.gpa;
            editingId = id;
            document.getElementById('submit-text').textContent = 'Update Student';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                await fetch(`/api/students/${id}`, { method: 'DELETE' });
                fetchStudents();
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderStudents(e.target.value);
        });

        fetchStudents();
    </script>
</body>
</html>
